name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Guards. These run first and are the cheapest, so a privacy or
  # secret regression fails in seconds rather than after a full build.
  # ─────────────────────────────────────────────────────────────────
  guards:
    name: Privacy and secret guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs full history to scan it
          fetch-depth: 0

      - name: No ad-targeting APIs in the app module
        run: ./scripts/guard-no-ad-targeting.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Confirm signing secrets are not tracked
        run: |
          set -euo pipefail
          for pattern in keystore.properties '*.jks' '*.keystore' \
                        google-services.json 'app/signing/'; do
            if git ls-files --error-unmatch "$pattern" >/dev/null 2>&1; then
              echo "FAIL: signing or Firebase config is tracked: $pattern"
              git ls-files | grep "$pattern"
              exit 1
            fi
          done
          echo "  OK: no signing secret or Firebase config is tracked."

  # ─────────────────────────────────────────────────────────────────
  # Build and unit tests.
  #
  # No instrumented tests run here. Every Compose UI test in the
  # repository currently fails on modern API levels with
  # InputManager.getInstance() NoSuchMethodException, because the
  # Compose BOM is older than the available system images. That needs
  # resolving before an emulator job can be added; see the note in
  # CycleCare-Redesign-Docs/06-testing-and-acceptance.md.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile instrumented test sources
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      # Exercises the R8 rules in app/proguard-rules.pro and
      # lintVitalRelease, which fails the build on lint errors.
      # Unsigned by design: no signing material is present in CI.
      - name: Release build (R8 + lint)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Instrumented tests on an API 36 emulator.
  #
  # WHY API 36 AND NOT 37 — do not "upgrade" this without reading first.
  #
  # On Android 37 every Compose UI test fails with
  #   NoSuchMethodException: android.hardware.input.InputManager.getInstance []
  # InputManager.getInstance() is a hidden framework method that Android 37
  # removed, and androidx.test calls it directly. This is not version skew:
  # verified by moving Compose BOM 2024.12.01 -> 2026.06.01 (ui-test-junit4
  # 1.7.6 -> 1.11.4) and androidx.test to its latest stable, which changed
  # nothing. Only androidx.test alphas handle it.
  #
  # API 36 is also the current Google Play target requirement, so it is the
  # most representative level to verify against regardless.
  #
  # Compose UI tests: 40 across home, calendar, logging, insights,
  # onboarding, privacy and the app shell.
  # Non-Compose instrumented tests: core:database 12 (the migration suite),
  # core:data 8, feature:onboarding 1.
  # ─────────────────────────────────────────────────────────────────
  instrumented:
    name: Instrumented tests (API 36)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: Pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7